name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      # HACS validation fails unless the repository carries the
      # home-assistant and hacs-integration topics. The failure message
      # does not say so.
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
