name: CI

# Is the factory broken? That is the only question this workflow answers, and
# red here always means there is work to do in THIS repository:
#
#   - lint fails on the factory's own tooling
#   - the gate's tests fail: digest parity, gate behaviour, climate checks
#   - an integration built here no longer passes the full gate against its
#     wig in the shop (the wig changed, or we broke something)
#
# What is on the Wig Shop shelf, and which wigs the factory could build, is a
# different question about somebody else's repository. It lives in
# shelf.yml, which reports and never goes red because of a wig. Until
# 2026-10-13 this workflow gated every shelf wig and went red every Monday
# for wigs nobody here could fix (owner ruling 2026-08-17, reversed
# 2026-10-13).

on:
  push:
    branches: [main]
  pull_request:
  # The drift alarm. HAIR is somebody else's repository and it moves, and the
  # failure mode is silent: the gate does not get quieter when HAIR changes,
  # it gets wrong. The scheduled run checks out HAIR at main rather than at
  # the pin. Red on a Monday therefore means HAIR main changed something the
  # factory depends on, which is ours to adapt to before the next pin bump.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      # The generated integration carries its own config and is linted by its
      # own repository's workflow. Linting it here as well would mean two
      # opinions about one file.
      - name: Lint the factory's tooling
        run: ruff check verify publish

  tests:
    name: Tests on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the floor, matching HAIR's own requires-python. The two legs
        # resolve different upstream decoders (infrared-protocols 5.x on
        # 3.13, the newest allowed on 3.14), so running both is what shows
        # the gate reads the same under each.
        python: ["3.13", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # verify/HAIR_REF is the one place the pin lives; setup.sh and
      # shelf.yml read the same file. Tests run against a released HAIR that
      # does not move under them, except on the weekly run (HAIR main).
      - name: Decide which HAIR to judge against
        id: hair
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ref=main
          else
            ref="$(tr -d '[:space:]' < verify/HAIR_REF)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Judging against HAIR $ref"

      - name: Check out HAIR
        uses: actions/checkout@v7
        with:
          repository: DAB-LABS/HAIR
          ref: ${{ steps.hair.outputs.ref }}
          path: reference/HAIR

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install the verification dependencies
        run: pip install -r verify/requirements.txt

      - name: Say what this leg is running
        run: |
          python - <<'PY'
          import importlib.metadata as m
          for name in ("cryptography", "pyyaml", "infrared-protocols"):
              print(f"{name:20} {m.version(name)}")
          PY

      # The digest is a published contract and the factory reproduces it by
      # calling HAIR rather than reimplementing it. This is what notices if
      # either half of that stops being true.
      - name: Recipe and digest parity
        run: python verify/test_recipe.py --hair reference/HAIR

      # What the gate SAYS about a wig: live comb, decode trust, carrierless
      # and extras refusals, repairs and attestations. Real shelf wigs
      # vendored in verify/fixtures/, and small mutations of them.
      - name: Gate behaviour
        run: python verify/test_gate.py --hair reference/HAIR

      # What the gate says about a climate integration: the lattice is the
      # wig's, the resolver agrees with HAIR's on every state, and every code
      # goes out as HAIR would send it. A synthetic lattice, broken on purpose.
      - name: Climate integration checks
        run: python verify/test_climate.py --hair reference/HAIR

  built:
    name: Built integrations
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Decide which HAIR to judge against
        id: hair
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ref=main
          else
            ref="$(tr -d '[:space:]' < verify/HAIR_REF)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out HAIR
        uses: actions/checkout@v7
        with:
          repository: DAB-LABS/HAIR
          ref: ${{ steps.hair.outputs.ref }}
          path: reference/HAIR

      - name: Check out the Wig Shop
        uses: actions/checkout@v7
        with:
          repository: DAB-LABS/WigShop
          path: reference/WigShop

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the verification dependencies
        run: pip install -r verify/requirements.txt

      # The full gate, codec checks included, against every integration this
      # repository has built. This is the leg that would have caught the
      # candle shipping without its ditto. Every failure here is ours: we
      # built it, so it is red on every event. Found by manifest, because a
      # climate integration has no codes.py.
      #
      # Every integration is checked before deciding, so one failure never
      # hides another. A built integration whose wig has left the shelf is
      # red too: the published repository now points at a source nobody can
      # read, and that is ours to resolve with update_integration.py.
      - name: Verify each built integration against its wig
        run: |
          shopt -s nullglob
          failed=()
          checked=0
          for manifest in */*/custom_components/*/manifest.json; do
            integration="$(dirname "$(dirname "$(dirname "$manifest")")")"
            # reference/ holds HAIR's own component, which has a manifest too.
            case "$integration" in reference/*) continue ;; esac
            slug="$(basename "$(dirname "$integration")")"
            # Shop files may carry the -perfect-fit tier suffix; the device
            # slug never does. Accept either spelling.
            matches=(reference/WigShop/wigs/*/"$slug".wig.json
                     reference/WigShop/wigs/*/"$slug"-perfect-fit.wig.json)
            if [ "${#matches[@]}" = "0" ]; then
              echo "::error title=$slug has no wig on the shelf::$integration was built from a wig the shop no longer carries."
              failed+=("$slug (no wig on the shelf)")
              continue
            fi
            checked=$((checked + 1))
            echo "::group::$slug"
            rc=0
            python verify/verify_wig.py --wig "${matches[0]}" \
              --integration "$integration" || rc=$?
            echo "::endgroup::"
            if [ "$rc" != "0" ]; then
              echo "::error title=$slug fails the gate::See the $slug group above (exit $rc)."
              failed+=("$slug (exit $rc)")
            fi
          done
          echo "$checked built integration(s) checked against their wigs."
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '  failing: %s\n' "${failed[@]}"
            exit 1
          fi
