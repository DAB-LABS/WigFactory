name: CI

# The repository whose whole job is gating other people's code had no gate on
# its own. Two changes shipped in one evening carrying a dead constant, an
# unused import and a stale fact name, and the only thing that caught any of
# it was a person running ruff by hand.
#
# Two kinds of red live here and they must never look alike:
#
#   - OUR fault: lint, digest parity, the gate crashing or not starting, a
#     built integration failing its own gate. Red on every event.
#   - THEIR data: a wig on the shelf the factory cannot build from. That is
#     a true statement about somebody else's repository, not a defect in this
#     one, so it annotates on push and pull request and goes red only on the
#     weekly run (owner ruling 2026-08-17). Otherwise one bad wig on the shelf
#     turns every pull request here red until somebody else fixes it.
#
# verify_wig.py exits 1 for a refusal and 3 for no verdict at all, which is
# what lets the sweep below tell the two apart.

on:
  push:
    branches: [main]
  pull_request:
  # The drift alarm. HAIR is somebody else's repository and it moves, and the
  # failure mode is silent: the gate does not get quieter when HAIR changes,
  # it gets wrong. The scheduled run is the one job that checks out HAIR at
  # main rather than at the pin, so the pin can be stale without anybody
  # finding out mid-publish.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      # The generated integration carries its own config and is linted by its
      # own repository's workflow. Linting it here as well would mean two
      # opinions about one file.
      - name: Lint the factory's tooling
        run: ruff check verify publish

  gate:
    name: Gate on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the floor, matching HAIR's own requires-python. The two legs
        # resolve different upstream decoders (infrared-protocols 5.x on
        # 3.13, 8.x on 3.14), so running both is what shows a wig reads the
        # same under each.
        python: ["3.13", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # verify/HAIR_REF is the one place the pin lives; setup.sh reads the
      # same file. A wig is judged by a released HAIR that does not move
      # under it, except on the weekly run, which judges it by HAIR main.
      - name: Decide which HAIR to judge against
        id: hair
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ref=main
          else
            ref="$(tr -d '[:space:]' < verify/HAIR_REF)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Judging against HAIR $ref"

      - name: Check out HAIR
        uses: actions/checkout@v7
        with:
          repository: DAB-LABS/HAIR
          ref: ${{ steps.hair.outputs.ref }}
          path: reference/HAIR

      - name: Check out the Wig Shop
        uses: actions/checkout@v7
        with:
          repository: DAB-LABS/WigShop
          path: reference/WigShop

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install the verification dependencies
        run: pip install -r verify/requirements.txt

      - name: Say what this leg is running
        run: |
          python - <<'PY'
          import importlib.metadata as m
          for name in ("cryptography", "pyyaml", "infrared-protocols"):
              print(f"{name:20} {m.version(name)}")
          PY

      # The digest is a published contract and the factory reproduces it by
      # calling HAIR rather than reimplementing it. This is what notices if
      # either half of that stops being true.
      - name: Recipe and digest parity
        run: python verify/test_recipe.py --hair reference/HAIR

      # Every wig in the shop, through the real input gate. Not a fixture: a
      # fixture cannot tell you the shop published something the factory
      # cannot read, and that is the interesting failure.
      - name: Survey the shop
        run: python verify/survey_shop.py

      # EVERY wig, then decide. A survey that stops at the first bad answer is
      # not one: on 2026-08-17 the Dreo fan refused under `set -e` and nothing
      # after it in the glob was gated at all.
      - name: Gate every wig the shop publishes
        run: |
          shopt -s nullglob
          found=0
          refused=()
          broken=()
          for wig in reference/WigShop/wigs/*/*.wig.json; do
            found=1
            name="$(basename "$wig")"
            echo "::group::$name"
            # No --require-handles: the account count is reported, never
            # enforced. Whether a wig is proven widely enough to publish is a
            # judgment the owner makes at publish time.
            rc=0
            python verify/verify_wig.py --wig "$wig" --gate-only || rc=$?
            echo "::endgroup::"
            case "$rc" in
              0) ;;
              1) refused+=("$name") ;;
              *) broken+=("$name (exit $rc)") ;;
            esac
          done

          if [ "$found" = "0" ]; then
            echo "::error::No wigs found in the shop clone. That is not a pass."
            exit 1
          fi

          status=0
          if [ "${#broken[@]}" -gt 0 ]; then
            echo
            echo "${#broken[@]} wig(s) the gate could not reach a verdict on:"
            for name in "${broken[@]}"; do
              echo "  $name"
              echo "::error title=No verdict on $name::The gate crashed or could not start. That is a factory problem, not a finding about the wig."
            done
            status=1
          fi

          if [ "${#refused[@]}" -gt 0 ]; then
            echo
            echo "${#refused[@]} wig(s) on the shelf the factory cannot build from:"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              level=error
              status=1
            else
              level=warning
            fi
            for name in "${refused[@]}"; do
              echo "  $name"
              echo "::$level title=Gate refused $name::See the $name group above. Red only on the weekly run."
            done
          fi

          if [ "$status" = "0" ] && [ "${#refused[@]}" = "0" ]; then
            echo "Every wig in the shop passes the input gate."
          fi
          exit "$status"

  built:
    name: Built integrations
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Decide which HAIR to judge against
        id: hair
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ref=main
          else
            ref="$(tr -d '[:space:]' < verify/HAIR_REF)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out HAIR
        uses: actions/checkout@v7
        with:
          repository: DAB-LABS/HAIR
          ref: ${{ steps.hair.outputs.ref }}
          path: reference/HAIR

      - name: Check out the Wig Shop
        uses: actions/checkout@v7
        with:
          repository: DAB-LABS/WigShop
          path: reference/WigShop

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the verification dependencies
        run: pip install -r verify/requirements.txt

      # The full gate, codec checks included, against every integration this
      # repository has already built. This is the leg that would have caught
      # the candle shipping without its ditto. A failure here is always ours:
      # we built it, so it goes red on every event.
      - name: Verify each built integration against its wig
        run: |
          set -e
          shopt -s nullglob
          found=0
          for codes in */*/custom_components/*/codes.py; do
            integration="$(dirname "$(dirname "$(dirname "$codes")")")"
            slug="$(basename "$(dirname "$integration")")"
            # Shop files may carry the -perfect-fit tier suffix; the device
            # slug never does. Accept either spelling.
            matches=(reference/WigShop/wigs/*/"$slug".wig.json
                     reference/WigShop/wigs/*/"$slug"-perfect-fit.wig.json)
            if [ "${#matches[@]}" = "0" ]; then
              echo "::warning::No shop wig for $slug; $integration was not verified"
              continue
            fi
            found=1
            echo "::group::$slug"
            python verify/verify_wig.py --wig "${matches[0]}" \
              --integration "$integration"
            echo "::endgroup::"
          done
          if [ "$found" = "0" ]; then
            echo "No built integration matched a shop wig."
          fi
